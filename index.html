<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feed the Snake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #1d3f66;
    --bg-2: #0b1a2c;
    --tile-a: #0f3b4c;
    --tile-b: #124558;
    --amber: #ffb703;
    --orange: #fb5607;
    --berry: #b388ff;
    --ink: #eaf4ff;
    --muted: #8fb0cc;
    --panel: rgba(255, 255, 255, 0.07);
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    background: radial-gradient(1200px 800px at 50% 0%, var(--bg-1), var(--bg-2));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  header {
    width: min(92vw, 70vh, 640px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  .scores { display: flex; gap: 10px; }
  .pill {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 6px 14px;
    min-width: 76px;
    text-align: center;
    line-height: 1.1;
  }
  .pill small { display: block; font-size: 0.72rem; color: var(--muted); font-weight: 500; }
  .pill b { font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .pill.bump b { animation: bump 0.25s ease-out; }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.35); color: var(--amber); } 100% { transform: scale(1); } }

  .stage {
    position: relative;
    width: min(92vw, 70vh, 640px);
    aspect-ratio: 1;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 22px;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.08), 0 30px 60px rgba(0,0,0,0.45);
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    border-radius: 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 24px;
    background: rgba(8, 20, 34, 0.62);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    transition: opacity 0.25s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h2 { margin: 0; font-size: clamp(1.8rem, 6vw, 2.6rem); font-weight: 700; }
  .overlay p { margin: 0; color: var(--muted); font-size: clamp(0.95rem, 2.6vw, 1.1rem); max-width: 30ch; }
  .overlay .big { color: var(--amber); font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 600; }
  button {
    font: inherit;
    font-weight: 600;
    font-size: 1.05rem;
    color: #1b1200;
    background: linear-gradient(135deg, var(--amber), var(--orange));
    border: 0;
    border-radius: 14px;
    padding: 10px 26px;
    margin-top: 6px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(251, 86, 7, 0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(1px) scale(0.98); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--berry); outline-offset: 3px; }

  footer {
    width: min(92vw, 70vh, 640px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  input[type="checkbox"] { accent-color: var(--amber); width: 18px; height: 18px; }

  @media (prefers-reduced-motion: reduce) {
    .pill.bump b { animation: none; }
    .overlay { transition: none; }
  }
</style>
</head>
<body>
  <header>
    <h1>Feed the Snake</h1>
    <div class="scores">
      <div class="pill" id="scorePill"><small>Score</small><b id="score">0</b></div>
      <div class="pill"><small>Best</small><b id="best">0</b></div>
    </div>
  </header>

  <div class="stage">
    <canvas id="canvas" aria-label="Snake game board"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Ready?</h2>
      <p id="ovText">Eat the berries and grow. Don't hit the walls or yourself.</p>
      <div class="big" id="ovScore" hidden></div>
      <button id="ovBtn" type="button">Start game</button>
      <p id="ovHint">Arrow keys or WASD to steer. Swipe on touch screens.</p>
    </div>
  </div>

  <footer>
    <span>Space to pause</span>
    <label><input type="checkbox" id="wrap"> Wrap around walls</label>
  </footer>

<script>
(() => {
  const GRID = 20;
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const scoreEl = $('score'), bestEl = $('best'), scorePill = $('scorePill');
  const overlay = $('overlay'), ovTitle = $('ovTitle'), ovText = $('ovText'),
        ovScore = $('ovScore'), ovBtn = $('ovBtn'), ovHint = $('ovHint');
  const wrapBox = $('wrap');

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- storage (safe) ----------
  let best = 0;
  try { best = parseInt(localStorage.getItem('feedSnakeBest') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;
  function saveBest() { try { localStorage.setItem('feedSnakeBest', String(best)); } catch (e) {} }

  // ---------- sound (synthesised, no files needed) ----------
  let audio = null;
  function initAudio() {
    if (!audio) {
      try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (audio && audio.state === 'suspended') audio.resume();
  }
  function tone(freq, dur, type = 'sine', vol = 0.12, slideTo = null, delay = 0) {
    if (!audio) return;
    const t = audio.currentTime + delay;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audio.destination);
    o.start(t); o.stop(t + dur);
  }
  const sfx = {
    eat() { tone(520, 0.09, 'triangle', 0.14, 880); tone(880, 0.12, 'triangle', 0.1, 1320, 0.07); },
    die() { tone(300, 0.35, 'sawtooth', 0.12, 70); tone(180, 0.4, 'square', 0.07, 50, 0.1); },
    turn() { tone(240, 0.03, 'sine', 0.03); },
    start() { tone(440, 0.08, 'triangle', 0.1); tone(660, 0.1, 'triangle', 0.1, null, 0.08); }
  };

  // ---------- state ----------
  const DIRS = { up: {x:0,y:-1}, down: {x:0,y:1}, left: {x:-1,y:0}, right: {x:1,y:0} };
  let snake, prev, dir, queue, food, score, tickMs, acc;
  let state = 'ready'; // ready | playing | paused | dead
  let shake = 0, foodPulse = 0, particles = [];
  let cell = 30, size = 600;

  function reset() {
    const cx = Math.floor(GRID / 2), cy = Math.floor(GRID / 2);
    snake = [{x:cx,y:cy}, {x:cx-1,y:cy}, {x:cx-2,y:cy}];
    prev = snake.map(s => ({...s}));
    dir = DIRS.right;
    queue = [];
    score = 0;
    tickMs = 140;
    acc = 0;
    particles = [];
    scoreEl.textContent = 0;
    spawnFood();
  }

  function spawnFood() {
    const free = [];
    for (let x = 0; x < GRID; x++)
      for (let y = 0; y < GRID; y++)
        if (!snake.some(s => s.x === x && s.y === y)) free.push({x, y});
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  // ---------- overlay ----------
  function showOverlay(mode) {
    overlay.classList.remove('hidden');
    ovScore.hidden = true;
    if (mode === 'ready') {
      ovTitle.textContent = 'Ready?';
      ovText.textContent = "Eat the berries and grow. Don't hit the walls or yourself.";
      ovBtn.textContent = 'Start game';
      ovHint.hidden = false;
    } else if (mode === 'paused') {
      ovTitle.textContent = 'Paused';
      ovText.textContent = 'Take a breather.';
      ovBtn.textContent = 'Resume';
      ovHint.hidden = true;
    } else if (mode === 'dead') {
      ovTitle.textContent = 'Game over';
      ovText.textContent = score >= best && score > 0 ? 'New best score!' : 'Nice try. Go again?';
      ovScore.hidden = false;
      ovScore.textContent = score + (score === 1 ? ' berry' : ' berries');
      ovBtn.textContent = 'Play again';
      ovHint.hidden = true;
    }
    ovBtn.focus({ preventScroll: true });
  }
  function hideOverlay() { overlay.classList.add('hidden'); }

  // ---------- controls ----------
  function startGame() {
    initAudio();
    if (state === 'dead' || state === 'ready') {
      reset();
      sfx.start();
    }
    state = 'playing';
    hideOverlay();
  }
  function togglePause() {
    if (state === 'playing') { state = 'paused'; showOverlay('paused'); }
    else if (state === 'paused') { startGame(); }
  }
  function steer(name) {
    if (state === 'ready' || state === 'dead') { startGame(); }
    if (state === 'paused') return;
    const d = DIRS[name];
    const last = queue.length ? queue[queue.length - 1] : dir;
    if (d.x === -last.x && d.y === -last.y) return;  // no reversing
    if (d.x === last.x && d.y === last.y) return;    // already going that way
    if (queue.length < 2) { queue.push(d); sfx.turn(); }
  }
  function primaryAction() {
    if (state === 'playing' || state === 'paused') togglePause();
    else startGame();
  }

  const KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right'
  };
  window.addEventListener('keydown', e => {
    if (KEYMAP[e.key]) { e.preventDefault(); steer(KEYMAP[e.key]); }
    else if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      if (document.activeElement === ovBtn) return; // button handles its own activation
      primaryAction();
    }
    else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { togglePause(); }
    else if (e.key === 'Enter' && state !== 'playing' && document.activeElement !== ovBtn) { primaryAction(); }
  });
  ovBtn.addEventListener('click', () => { if (state === 'paused') togglePause(); else startGame(); });
  wrapBox.addEventListener('change', () => wrapBox.blur());

  // swipe
  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0]; touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener('touchmove', e => {
    if (!touchStart) return;
    const t = e.touches[0];
    const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 24) {
      steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
      touchStart = { x: t.clientX, y: t.clientY };
    }
  }, { passive: true });
  canvas.addEventListener('touchend', () => { touchStart = null; });

  // ---------- game step ----------
  function step() {
    prev = snake.map(s => ({...s}));
    if (queue.length) dir = queue.shift();
    let nx = snake[0].x + dir.x, ny = snake[0].y + dir.y;

    if (wrapBox.checked) {
      nx = (nx + GRID) % GRID; ny = (ny + GRID) % GRID;
    } else if (nx < 0 || ny < 0 || nx >= GRID || ny >= GRID) {
      return die();
    }

    const eating = food && nx === food.x && ny === food.y;
    const body = eating ? snake : snake.slice(0, -1); // tail will move away unless growing
    if (body.some(s => s.x === nx && s.y === ny)) return die();

    snake.unshift({x: nx, y: ny});
    if (eating) {
      score++;
      scoreEl.textContent = score;
      scorePill.classList.remove('bump'); void scorePill.offsetWidth; scorePill.classList.add('bump');
      burst(food.x, food.y);
      sfx.eat();
      tickMs = Math.max(70, 140 - score * 2.5);
      spawnFood();
    } else {
      snake.pop();
    }
  }

  function die() {
    state = 'dead';
    shake = reduceMotion ? 0 : 1;
    sfx.die();
    if (score > best) { best = score; bestEl.textContent = best; saveBest(); }
    setTimeout(() => { if (state === 'dead') showOverlay('dead'); }, 650);
  }

  function burst(gx, gy) {
    if (reduceMotion) return;
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 3.5;
      particles.push({
        x: gx + 0.5, y: gy + 0.5,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, color: Math.random() < 0.5 ? '#b388ff' : '#ffd166'
      });
    }
  }

  // ---------- rendering ----------
  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    size = rect.width;
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = size / GRID;
  }
  window.addEventListener('resize', resize);

  function lerp(a, b, t) { return a + (b - a) * t; }
  function mixColor(c1, c2, t) {
    return `rgb(${Math.round(lerp(c1[0], c2[0], t))},${Math.round(lerp(c1[1], c2[1], t))},${Math.round(lerp(c1[2], c2[2], t))})`;
  }
  const TAIL = [255, 183, 3], HEAD = [251, 86, 7];

  function drawBoard() {
    for (let x = 0; x < GRID; x++) {
      for (let y = 0; y < GRID; y++) {
        ctx.fillStyle = (x + y) % 2 ? '#0f3b4c' : '#124558';
        ctx.fillRect(x * cell, y * cell, cell + 0.5, cell + 0.5);
      }
    }
  }

  function drawFood(dt) {
    if (!food) return;
    foodPulse += dt * 0.004;
    const pulse = 1 + Math.sin(foodPulse * 2) * 0.08;
    const cx = (food.x + 0.5) * cell, cy = (food.y + 0.5) * cell;
    const r = cell * 0.32 * pulse;
    const glow = ctx.createRadialGradient(cx, cy, r * 0.4, cx, cy, r * 3);
    glow.addColorStop(0, 'rgba(179,136,255,0.55)');
    glow.addColorStop(1, 'rgba(179,136,255,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, cy, r * 3, 0, Math.PI * 2); ctx.fill();

    const g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.1, cx, cy, r);
    g.addColorStop(0, '#e4d2ff');
    g.addColorStop(1, '#8e5cf0');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();

    // little leaf
    ctx.fillStyle = '#7bd88f';
    ctx.beginPath();
    ctx.ellipse(cx + r * 0.35, cy - r * 1.05, r * 0.38, r * 0.2, -0.6, 0, Math.PI * 2);
    ctx.fill();
  }

  function snakePoints(alpha) {
    const pts = [];
    for (let i = 0; i < snake.length; i++) {
      const from = prev[i] || prev[prev.length - 1] || snake[i];
      const to = snake[i];
      const jump = Math.abs(to.x - from.x) > 1 || Math.abs(to.y - from.y) > 1; // wrapped
      const a = jump ? 1 : alpha;
      pts.push({
        x: (lerp(from.x, to.x, a) + 0.5) * cell,
        y: (lerp(from.y, to.y, a) + 0.5) * cell,
        jump
      });
    }
    return pts;
  }

  function drawSnake(alpha) {
    const pts = snakePoints(alpha);
    const n = pts.length;
    const bodyR = cell * 0.4;

    // soft shadow
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    for (let i = n - 1; i >= 0; i--) {
      ctx.beginPath(); ctx.arc(pts[i].x + 2, pts[i].y + 4, bodyR, 0, Math.PI * 2); ctx.fill();
    }

    // body: tail to head so the head sits on top
    for (let i = n - 1; i >= 0; i--) {
      const t = n === 1 ? 1 : 1 - i / (n - 1);
      const color = mixColor(TAIL, HEAD, t);
      const r = bodyR * lerp(0.78, 1, t);
      ctx.fillStyle = color;
      ctx.strokeStyle = color;
      ctx.lineCap = 'round';
      ctx.lineWidth = r * 2;
      if (i < n - 1 && !pts[i].jump && !pts[i + 1].jump) {
        ctx.beginPath();
        ctx.moveTo(pts[i + 1].x, pts[i + 1].y);
        ctx.lineTo(pts[i].x, pts[i].y);
        ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(pts[i].x, pts[i].y, r, 0, Math.PI * 2); ctx.fill();

      // subtle belly highlight
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.beginPath(); ctx.arc(pts[i].x - r * 0.2, pts[i].y - r * 0.28, r * 0.55, 0, Math.PI * 2); ctx.fill();
    }

    // head details
    const h = pts[0];
    ctx.fillStyle = mixColor(TAIL, HEAD, 1);
    ctx.beginPath(); ctx.arc(h.x, h.y, bodyR * 1.08, 0, Math.PI * 2); ctx.fill();
    const fx = dir.x, fy = dir.y, px = -fy, py = fx;
    const eyeOff = bodyR * 0.5, eyeFwd = bodyR * 0.35, eyeR = bodyR * 0.3;
    for (const side of [-1, 1]) {
      const ex = h.x + fx * eyeFwd + px * eyeOff * side;
      const ey = h.y + fy * eyeFwd + py * eyeOff * side;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex, ey, eyeR, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#10202e';
      ctx.beginPath(); ctx.arc(ex + fx * eyeR * 0.35, ey + fy * eyeR * 0.35, eyeR * 0.55, 0, Math.PI * 2); ctx.fill();
    }
    // tongue flick
    if (state === 'playing' && Math.floor(foodPulse * 1.2) % 3 === 0) {
      ctx.strokeStyle = '#ff4d6d';
      ctx.lineWidth = 2;
      ctx.beginPath();
      const tx = h.x + fx * bodyR * 1.05, ty = h.y + fy * bodyR * 1.05;
      ctx.moveTo(tx, ty);
      ctx.lineTo(tx + fx * bodyR * 0.6, ty + fy * bodyR * 0.6);
      ctx.stroke();
    }
  }

  function updateParticles(dt) {
    const s = dt / 1000;
    for (const p of particles) {
      p.x += p.vx * s; p.y += p.vy * s;
      p.vx *= 0.96; p.vy *= 0.96;
      p.life -= s * 1.7;
    }
    particles = particles.filter(p => p.life > 0);
  }
  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x * cell, p.y * cell, cell * 0.1 * p.life + 1, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- main loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(now - last, 100);
    last = now;

    if (state === 'playing') {
      acc += dt;
      while (acc >= tickMs && state === 'playing') { step(); acc -= tickMs; }
    }
    updateParticles(dt);

    const alpha = state === 'playing' ? Math.min(acc / tickMs, 1)
                : state === 'dead' ? 1
                : state === 'paused' ? Math.min(acc / tickMs, 1) : 1;

    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake * 10, (Math.random() - 0.5) * shake * 10);
      shake = Math.max(0, shake - dt / 450);
    }
    ctx.clearRect(-20, -20, size + 40, size + 40);
    drawBoard();
    drawFood(dt);
    drawSnake(alpha);
    drawParticles();
    ctx.restore();

    requestAnimationFrame(frame);
  }

  reset();
  resize();
  showOverlay('ready');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
